<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Bookshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <aside class="auth-side">
        <div class="brand"><span class="logo">B</span> Bookshelf</div>
        <h2>Find the right book.<br>Keep it on your shelf.</h2>
        <p>Search millions of books, compare ratings and build your personal reading list.</p>
    </aside>

    <main class="auth-main">
        <form id="auth-form" class="auth-card" data-action="login">
            <h1>Welcome back</h1>
            <p class="muted">Login to your reading dashboard.</p>
            <label>Username
                <input id="username" autocomplete="username" required>
            </label>
            <label>Password
                <input id="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Log in</button>
            <p id="message"></p>
            <p class="muted">New here? <a href="register.html">Create an account</a></p>
        </form>
        <p class="served">Served by <span id="server">-</span></p>
    </main>
    <script src="auth.js"></script>
</body>
</html>
